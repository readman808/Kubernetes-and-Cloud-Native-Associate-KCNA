apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        volumeMounts: [{name: tls, mountPath: /etc/tls, readOnly: true}]
      volumes:
      - name: tls
        secret: {secretName: {{ .Values.tls.secretName }}}

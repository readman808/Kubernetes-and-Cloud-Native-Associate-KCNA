# 3-node RabbitMQ cluster using Kubernetes peer discovery. Namespace is supplied by kubectl -n.
apiVersion: v1
kind: Secret
metadata: {name: rabbitmq-secret}
stringData:
  erlang-cookie: "LABCOOKIEKEEPSNODESTOGETHER"
  username: admin
  password: labpass123
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rabbitmq}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: rabbitmq-peer-discovery}
rules:
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: rabbitmq-peer-discovery}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rabbitmq-peer-discovery}
subjects:
- {kind: ServiceAccount, name: rabbitmq}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq-headless}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: rabbitmq}
  ports:
  - {name: epmd, port: 4369}
  - {name: amqp, port: 5672}
  - {name: dist, port: 25672}
  - {name: management, port: 15672}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq}
spec:
  selector: {app: rabbitmq}
  ports:
  - {name: amqp, port: 5672, targetPort: 5672}
  - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq}
spec:
  serviceName: rabbitmq-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      serviceAccountName: rabbitmq
      terminationGracePeriodSeconds: 30
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        ports:
        - {name: amqp, containerPort: 5672}
        - {name: management, containerPort: 15672}
        - {name: epmd, containerPort: 4369}
        - {name: dist, containerPort: 25672}
        env:
        - name: MY_POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: MY_POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - {name: RABBITMQ_USE_LONGNAME, value: "true"}
        - {name: RABBITMQ_NODENAME, value: "rabbit@$(MY_POD_NAME).rabbitmq-headless.$(MY_POD_NAMESPACE).svc.cluster.local"}
        - {name: K8S_SERVICE_NAME, value: rabbitmq-headless}
        - {name: K8S_HOSTNAME_SUFFIX, value: ".rabbitmq-headless.$(MY_POD_NAMESPACE).svc.cluster.local"}
        - name: RABBITMQ_ERLANG_COOKIE
          valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: erlang-cookie}}
        - name: RABBITMQ_DEFAULT_USER
          valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: username}}
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom: {secretKeyRef: {name: rabbitmq-secret, key: password}}
        readinessProbe:
          exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/rabbitmq}
        - {name: data, mountPath: /var/lib/rabbitmq}
      volumes:
      - name: config
        configMap: {name: rabbitmq-config}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
